<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Dateiabruf – 3D-WINDT intern</title>
    <style>
      body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; }
      main { max-width: 36rem; margin: 4rem auto; background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08); }
      h1 { font-size: 1.25rem; margin: 0 0 1rem; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; margin: 0 0 1.5rem; }
      dt { color: #475569; }
      dd { margin: 0; word-break: break-all; }
      button { background: #0f766e; color: #fff; border: 0; border-radius: 8px; padding: 0.75rem 1.25rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
      button[disabled] { opacity: 0.6; cursor: not-allowed; }
      progress { width: 100%; height: 0.75rem; margin-top: 1rem; }
      .status { margin-top: 0.75rem; font-size: 0.9rem; color: #475569; }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <main>
      <h1>Kundendatei abrufen</h1>
      <dl>
        <dt>Datei</dt><dd id="file-name">–</dd>
        <dt>Größe</dt><dd id="file-size">–</dd>
        <dt>Hochgeladen</dt><dd id="file-date">–</dd>
      </dl>
      <button id="download" type="button" disabled>Datei herunterladen</button>
      <progress id="progress" value="0" max="1" hidden></progress>
      <p id="status" class="status" role="status">Link wird geprüft …</p>
    </main>
    <script src="/datei-abruf/abruf.js" defer></script>
  </body>
</html>
